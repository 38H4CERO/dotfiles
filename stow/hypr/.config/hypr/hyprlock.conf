general {
    hide_cursor = true
}

background {
    monitor =
    path = ~/Images/Wallpapers/rain.png
    blur_passes = 3
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2
    outer_color = rgba(E6E6FAee)
    inner_color = rgba(1e1e2ecc)
    font_color = rgba(E6E6FAff)
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    position = 0, -80
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 72
    color = rgba(E6E6FAff)
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 20
    color = rgba(E6E6FAcc)
    position = 0, 40
    halign = center
    valign = center
}
